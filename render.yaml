services:
  - type: web
    name: flask-youtube-transcript
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    plan: free
    pythonVersion: 3.11.8
    envVars:
      - key: PORT
        value: 5000
      - key: PYTHON_VERSION
        value: 3.11
    healthCheckPath: / 